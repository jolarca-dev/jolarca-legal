# legal-text-sync.yml — publication pipeline for canonical legal texts.
# Triggers on legal-text release tags (legal-texts-vX.Y.Z). Builds the
# publish manifest, then:
#   1. opens a PR against jolarca pinning the new versions, and
#   2. notifies the consent registry (jolarca-compliance lawful-basis) that
#      the underlying text versions changed — consent recorded against an
#      old version must be re-evaluated.
# MAJOR changes additionally require the P2B 30-day notice evidence to be
# linked in the tag annotation BEFORE tagging (see platform-regulation/p2b).
name: legal-text-sync
on:
  push:
    tags: ["legal-texts-v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate & build publish manifest
        run: |
          python3 scripts/legal-text-version.py --validate
          python3 scripts/legal-text-version.py --manifest > publish-manifest.json

      - name: Cross-check consent registry consistency
        env:
          COMPLIANCE_RO_TOKEN: ${{ secrets.COMPLIANCE_RO_TOKEN }}
        run: python3 scripts/cross-check-consent.py --manifest publish-manifest.json

      - name: Open marketplace PR pinning new versions
        env:
          # Fine-grained PAT scoped to jolarca PR creation only.
          LEGAL_SYNC_TOKEN: ${{ secrets.LEGAL_SYNC_TOKEN }}
        run: |
          # TODO(legal-automation): on first production run, wire this to
          # `gh pr create` against journeyoflife-org/jolarca using
          # LEGAL_SYNC_TOKEN, attaching publish-manifest.json and the
          # plain-language changelog excerpts. Kept dry-run until the
          # marketplace repo exposes the legal-text pin contract.
          echo "::notice::Dry run — manifest validated, PR creation pending marketplace pin contract."
