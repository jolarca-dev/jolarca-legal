# ci.yml — inherited baseline gate: lint + validate everything committed.
# Job name MUST stay "ci": branch protection requires the "ci" status check.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: YAML lint
        run: |
          pip install --quiet "yamllint>=1.35"
          YAMLLINT_CFG="{extends: default, rules: {line-length: {max: 140},"
          YAMLLINT_CFG="$YAMLLINT_CFG comments: {min-spaces-from-content: 1},"
          YAMLLINT_CFG="$YAMLLINT_CFG truthy: disable, document-start: disable,"
          YAMLLINT_CFG="$YAMLLINT_CFG comments-indentation: disable}}"
          yamllint -d "$YAMLLINT_CFG" .github/ .pre-commit-config.yaml qodana.yaml

      - name: Legal-text front-matter validation
        run: python3 scripts/legal-text-version.py --validate

      - name: Contract registers parse & schema intact
        run: python3 scripts/renewal-report.py --check-register

      - name: Personal-data pattern scan
        run: bash scripts/check-personal-data.sh

      - name: Shellcheck operator scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
