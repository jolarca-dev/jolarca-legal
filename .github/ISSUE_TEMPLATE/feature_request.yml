name: Feature request
description: New capability for the legal function or its automation
labels: ["enhancement"]
body:
  - type: textarea
    id: capability
    attributes:
      label: Capability
      description: What should the legal function/repository be able to do, and why now?
    validations:
      required: true
  - type: textarea
    id: obligation
    attributes:
      label: Regulatory / business driver
      description: Which obligation, risk, or business need drives this (DSA, P2B, GDPR, renewal exposure, audit finding)?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Target area
      options:
        - legal-texts
        - contracts
        - corporate
        - platform-regulation
        - intellectual-property
        - regulatory
        - disputes
        - insurance
        - opinions
        - automation
        - other
    validations:
      required: true
