name: Bug report
description: Defect in a legal record, register, template, or this repo's automation (NOT an incident — use SECURITY.md for those)
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed vs expected behavior
      description: What is wrong, what should be true. Do NOT paste privileged material or personal data into this issue.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - legal-texts
        - contracts
        - corporate
        - platform-regulation
        - intellectual-property
        - regulatory
        - disputes
        - insurance
        - opinions
        - ci-cd
        - scripts
        - docs
        - other
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: If legal data may have leaked, STOP and follow SECURITY.md instead.
      options: [minor (typo/format), moderate (wrong reference/date), major (wrong term/obligation recorded)]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction / evidence
      description: File path(s) and how the defect was discovered (audit, counterparty notice, product report).
    validations:
      required: true
