# Tool configuration for the legal repository.
# Python tooling here exists only to support lint/pre-commit harnesses and
# register/front-matter validation scripts; there is no application code.

[project]
name = "jolarca-legal-tooling"
version = "0.1.0"
description = "Operator tooling pins for lint/pre-commit harnesses and legal-text validators (no runtime code)."
requires-python = ">=3.11"
dependencies = [
    "pre-commit>=3.8",
    "yamllint>=1.35",
]

[tool.codespell]
# Spelling hygiene for legal texts — legal terms whitelisted below.
skip = "*.pdf,*.docx,.idea,.venv"
ignore-words-list = "uab,ei,fo"
