# Qodana static analysis — inherited from jol-repo-template baseline.
# Legal repo profile: lint scripts; document content quality is handled by
# the ci workflow (front-matter validation, personal-data scan) rather than
# the Qodana linter.
version: "1.0"
linter: jetbrains/qodana-python:2025.1
profile:
  name: qodana.recommended
exclude:
  - name: All
    paths:
      - .idea
      - .venv
include:
  - name: CheckLicenseCopyright
